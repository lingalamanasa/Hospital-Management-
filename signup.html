<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up & Facility Registration — Stackly Health | Cloud Healthcare ERP</title>
  <meta name="description" content="Create a Stackly Health account. Register your hospital, clinic, diagnostic lab, or sign up as a patient/doctor for free.">
  <link rel="icon" href="assets/images/stackly-logo.png" type="image/png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page" style="position: relative;">

  <!-- Floating Back to Home Button -->
  <a href="index.html" class="back-home-floating-btn" style="position: fixed; top: 20px; left: 24px; display: inline-flex; align-items: center; gap: 8px; font-size: 0.86rem; font-weight: 700; color: #1E293B; background: #FFFFFF; padding: 10px 18px; border-radius: 9999px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); text-decoration: none; border: 1px solid #E2E8F0; z-index: 999; transition: all 0.2s ease;">
    <i class="fa fa-arrow-left" style="color: var(--primary, #6355FF);"></i> Back to Home
  </a>

  <div class="auth-card" style="max-width: 580px;">
    <!-- In-Card Back to Home Bar -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
      <a href="index.html" style="display: inline-flex; align-items: center; gap: 8px; font-size: 0.84rem; font-weight: 700; color: var(--primary, #6355FF); text-decoration: none; padding: 6px 14px; border-radius: 9999px; background: rgba(99, 85, 255, 0.08); transition: all 0.2s ease;">
        <i class="fa fa-arrow-left"></i> Back to Home
      </a>
      <a href="dashboard.html" style="font-size: 0.80rem; font-weight: 600; color: #64748B; text-decoration: none;">
        <i class="fa fa-gauge"></i> Atelier Portal
      </a>
    </div>

    <div class="auth-header">
      <img src="assets/images/login-portal-hero.webp" alt="Register Facility on Stackly" style="width: 100%; height: 140px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 16px; box-shadow: var(--shadow-sm);">
      <a href="index.html" class="brand-logo">
        <img src="assets/images/stackly-logo.png" alt="Stackly Health Logo">
        <span class="brand-badge">Health ERP</span>
      </a>
      <h2 style="font-size: 1.8rem; margin-top: 10px;">Create Your Account</h2>
      <p style="color: var(--gray-500); font-size: 0.9rem;">Join 2,800+ healthcare facilities operating on Stackly Cloud</p>
    </div>

    <!-- Role Switcher -->
    <div class="role-switcher">
      <button type="button" class="role-tab-btn active" data-role="user">
        <i class="fa fa-user"></i> User
      </button>
      <button type="button" class="role-tab-btn" data-role="admin">
        <i class="fa fa-shield-halved"></i> Admin
      </button>
    </div>

    <form id="authSignupForm" onsubmit="handleAuthSignup(event)">
      <input type="hidden" id="selectedRole" value="user">

      <!-- Common Fields -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
        <div class="form-group">
          <label class="form-label">First Name *</label>
          <input type="text" class="form-control" placeholder="Sarah" required>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name *</label>
          <input type="text" class="form-control" placeholder="Jenkins" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Work / Contact Email *</label>
        <input type="email" class="form-control" placeholder="sarah.jenkins@hospital.org" required>
      </div>

      <!-- Admin Specific Fields -->
      <div class="admin-only" style="display: none;">
        <div class="form-group">
          <label class="form-label">Hospital / Healthcare Facility Name *</label>
          <input type="text" class="form-control" placeholder="Apollo Memorial Hospital">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="form-group">
            <label class="form-label">Facility Category</label>
            <select class="form-control">
              <option>Tertiary Care Multi-Specialty (150+ Beds)</option>
              <option>Secondary General Hospital (50-150 Beds)</option>
              <option>Daycare Surgical / Maternity Center</option>
              <option>Diagnostic Laboratory Chain (LIMS)</option>
              <option>Specialty Polyclinic</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Bed Capacity</label>
            <input type="number" class="form-control" placeholder="e.g. 150">
          </div>
        </div>
      </div>

      <!-- User Specific Fields -->
      <div class="user-only">
        <div class="form-group">
          <label class="form-label">User Profile Type</label>
          <select class="form-control">
            <option>Patient / Family Caregiver</option>
            <option>Consulting Physician / Specialist</option>
            <option>Registered Nurse / Ward Staff</option>
            <option>Laboratory Technician</option>
          </select>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
        <div class="form-group">
          <label class="form-label">Password *</label>
          <input type="password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <input type="password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <div class="form-group" style="font-size: 0.825rem; color: #64748B;">
        <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer;">
          <input type="checkbox" checked required style="margin-top: 3px;">
          <span>I agree to Stackly's <a href="#" style="color: var(--primary);">Terms of Service</a>, <a href="#" style="color: var(--primary);">HIPAA Business Associate Agreement</a>, and <a href="#" style="color: var(--primary);">Privacy Policy</a>.</span>
        </label>
      </div>

      <a href="login.html" class="btn btn-primary btn-lg" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;">
        <i class="fa fa-arrow-right-to-bracket"></i> Sign In
      </a>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--gray-500);">
      Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Sign In here</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function handleAuthSignup(e) {
      e.preventDefault();
      const role = document.getElementById('selectedRole').value;
      const submitBtn = document.getElementById('authSubmitBtn');
      submitBtn.innerHTML = '<i class="fa fa-circle-notch fa-spin"></i> Initializing Account...';
      submitBtn.disabled = true;

      setTimeout(() => {
        if (role === 'admin') {
          window.location.href = 'dashboard-admin.html';
        } else {
          window.location.href = 'dashboard-user.html';
        }
      }, 700);
    }
  </script>
</body>
</html>
