<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Stackly Health ERP</title>
  <meta name="description" content="The requested clinical module or page was not found on Stackly Health ERP.">
  <link rel="icon" href="assets/images/stackly-logo.png" type="image/png">
  
  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
  
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 25%, rgba(99, 85, 255, 0.09) 0%, rgba(248, 250, 252, 1) 75%);
      font-family: var(--font-body);
      color: var(--dark-800);
      padding: 30px 20px;
      box-sizing: border-box;
    }
    .error-container {
      max-width: 680px;
      width: 100%;
      text-align: center;
      margin: auto;
    }
    .error-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.1);
      color: #DC2626;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 20px;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .error-num {
      font-family: var(--font-heading);
      font-size: clamp(6.5rem, 18vw, 11rem);
      font-weight: 900;
      line-height: 0.9;
      margin-bottom: 16px;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--primary) 0%, #38BDF8 60%, var(--primary-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 15px 30px rgba(99, 85, 255, 0.25));
      position: relative;
      display: inline-block;
    }
    .error-num::after {
      content: '⚕️';
      position: absolute;
      font-size: 2.2rem;
      top: 10%;
      right: -25px;
      -webkit-text-fill-color: initial;
      animation: floatCross 3s ease-in-out infinite;
    }
    @keyframes floatCross {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(8deg); }
    }
    .error-title {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 800;
      color: var(--dark-900);
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }
    .error-desc {
      font-size: 1.05rem;
      color: var(--gray-500);
      max-width: 580px;
      margin: 0 auto 36px;
      line-height: 1.6;
    }
    .error-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn-back-home {
      background: var(--primary);
      color: #FFFFFF !important;
      box-shadow: 0 4px 14px rgba(99, 85, 255, 0.35);
      text-decoration: none;
    }
    .btn-back-home:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 85, 255, 0.45);
      color: #FFFFFF !important;
    }
    .btn-go-back {
      background: #0284C7;
      color: #FFFFFF !important;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
      cursor: pointer;
      text-decoration: none;
      border: none;
    }
    .btn-go-back:hover {
      background: #0369A1;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.4);
      color: #FFFFFF !important;
    }
    @media (max-width: 540px) {
      body {
        padding: 24px 16px;
      }
      .error-num {
        font-size: clamp(4.5rem, 20vw, 7rem);
      }
      .error-num::after {
        font-size: 1.6rem;
        right: -15px;
      }
      .error-title {
        font-size: 1.5rem;
      }
      .error-desc {
        font-size: 0.95rem;
        margin-bottom: 28px;
      }
      .error-actions {
        flex-direction: column;
        width: 100%;
        max-width: 320px;
        margin: 0 auto;
      }
      .error-actions .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <main class="error-container">
    <span class="error-badge"><i class="fa fa-triangle-exclamation"></i> Error 404 &bull; Clinical Module Unavailable</span>
    
    <div>
      <div class="error-num">404</div>
    </div>
    
    <h1 class="error-title">Page or Healthcare Module Not Found</h1>
    
    <p class="error-desc">
      The clinical route, doctor schedule, or medical resource you attempted to reach has been relocated, archived, or is currently under scheduled deployment.
    </p>

    <div class="error-actions">
      <a href="index.html" class="btn btn-primary btn-lg btn-back-home" id="errBtnHome">
        <i class="fa fa-house-medical"></i> Back to Home
      </a>
      <button onclick="window.history.length > 1 ? window.history.back() : window.location.href='index.html'" class="btn btn-secondary btn-lg btn-go-back" id="errBtnGoBack">
        <i class="fa fa-arrow-left"></i> Go Back
      </button>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
